[project]
name = "omop-llm"
dynamic = ["version"]
description = "LLM interfaces for OMOP"
authors = [
  {name = "Nico Loesch", email = "n.loesch@unsw.edu.au"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "any-llm-sdk[ollama,gemini]>=1.22.0",
    "httpx",
    "oa-configurator>=0.2.0,<1.0.0",
    "ollama",  # already imported by any-llm-sdk
    "pydantic",
  ]

[project.optional-dependencies]
instructor = [
    "instructor>=1.13.0",
]
dev = [
    "omop-llm[instructor]",
    "mypy>=1.19.1",
    "ty>=0.0.59",
    "ruff",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "types-pyyaml>=6.0.12.20250915",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-mermaid2-plugin"
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/omop_llm"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
  "unit: Unit tests that do not require external API calls",
  "integration: Tests that hit live LLM endpoints (requires API keys)",
]